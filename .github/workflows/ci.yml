name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

env:
  UV_DYNAMIC_VERSIONING_BYPASS: "2.2.0"
  PDM_BUILD_SCM_VERSION: "2.2.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Download Snapshot Release Assets (v0.0.5)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p ~/.cache/ml_ecosystem_snapshots/snapshots
        gh release download v0.0.5 --repo SamuelMarks/ml-ecosystem-snapshots --pattern "*.json" --dir ~/.cache/ml_ecosystem_snapshots/snapshots --clobber
        if [ -f ~/.cache/ml_ecosystem_snapshots/snapshots/concept_map.json ]; then
          mv ~/.cache/ml_ecosystem_snapshots/snapshots/concept_map.json ~/.cache/ml_ecosystem_snapshots/concept_map.json
        fi

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest pytest-cov interrogate mypy build
        pip install -e ".[test,parity]"

    - name: Check Disallowed 3rd-Party Imports
      run: python scripts/check_imports.py

    - name: Check Code Formatting (Ruff)
      run: ruff format --check .

    - name: Check Linting (Ruff)
      run: ruff check .

    - name: Check Docstring Coverage (Interrogate & AST Docstrings)
      run: |
        interrogate -vv -f 100 -M -i -c pyproject.toml src scripts tests
        python scripts/check_docstrings.py

    - name: Check Static Typing (Mypy & AST Typing Linter)
      run: |
        python scripts/lint_typing.py
        mypy src tests scripts

    - name: Check Snapshot Compliance
      run: python scripts/check_compliance.py

    - name: Test & Coverage (100% Line, Branch, Function)
      run: |
        pytest --cov=src/zero_keras --cov=scripts --cov-branch --cov-fail-under=100 --cov-report=xml --cov-report=json

    - name: Update Badges
      run: |
        python scripts/update_badges.py
        if ! git diff --exit-code README.md; then
          echo "Coverage badges in README.md are out of date. Please run pre-commit or the update badges script locally and commit the changes."
          exit 1
        fi

    - name: Build Package
      run: python -m build
